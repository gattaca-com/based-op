name: lint

on:
  push:
    branches: [main]
    paths:
      - "based/**"
  pull_request:
    paths:
      - "based/**"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: based
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: based -> target

      # Install just command runner
      - name: Install just
        uses: extractions/setup-just@v3
        with:
          just-version: '1.40.0'

      # Install the specific nightly toolchain and components
      - name: Install nightly toolchain and components
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          profile: minimal
          components: clippy, rustfmt

      # Run fmt check
      - name: Run fmt check
        run: |
          just fmt-check

      # Run clippy check  
      - name: Run clippy check
        run: |
          just clippy
