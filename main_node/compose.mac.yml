networks:
  op_net:
    driver: bridge

services:
  op-geth:
    networks:
      - op_net
    ports:
      - "${OP_GETH_RPC_PORT}:${OP_GETH_RPC_PORT}"
      - "${OP_GETH_WS_PORT}:${OP_GETH_WS_PORT}"
      - "${OP_GETH_ENGINE_RPC_PORT}:${OP_GETH_ENGINE_RPC_PORT}"
      - "${OP_GETH_GOSSIP_PORT}:${OP_GETH_GOSSIP_PORT}/tcp"
      - "${OP_GETH_GOSSIP_PORT}:${OP_GETH_GOSSIP_PORT}/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  op-node:
    networks:
      - op_net
    ports:
      - "${OP_NODE_RPC_PORT}:${OP_NODE_RPC_PORT}"
      - "${OP_NODE_GOSSIP_PORT}:${OP_NODE_GOSSIP_PORT}/tcp"
      - "${OP_NODE_GOSSIP_PORT}:${OP_NODE_GOSSIP_PORT}/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override inter-container URLs for bridge networking
    command:
      - op-node
      - --l2=http://based-portal:${PORTAL_PORT}
      - --l2.jwt-secret=/config/jwt
      - --verifier.l1-confs=1
      - --rollup.config=/config/rollup.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=${OP_NODE_RPC_PORT}
      - --rpc.enable-admin
      - --l1=${L1_RPC_URL}
      - --l1.rpckind=standard
      - --l1.beacon=${L1_BEACON_RPC_URL}
      - --p2p.advertise.ip=${OP_NODE_GOSSIP_IP}
      - --p2p.advertise.tcp=${OP_NODE_GOSSIP_PORT}
      - --p2p.advertise.udp=${OP_NODE_GOSSIP_PORT}
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=${OP_NODE_GOSSIP_PORT}
      - --p2p.listen.udp=${OP_NODE_GOSSIP_PORT}
      - --p2p.sequencer.key=${OP_NODE_SEQUENCER_KEY}
      - --safedb.path=/data/op-node/op-node-beacon-data
      - --sequencer.enabled

  op-batcher:
    networks:
      - op_net
    ports:
      - "8548:8548"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override inter-container URLs for bridge networking
    command:
      - op-batcher
      - --l2-eth-rpc=http://based-portal:${PORTAL_PORT}
      - --rollup-rpc=http://op-node:${OP_NODE_RPC_PORT}
      - --sub-safety-margin=6
      - --num-confirmations=1
      - --safe-abort-nonce-too-low-count=3
      - --resubmission-timeout=30s
      - --rpc.addr=0.0.0.0
      - --rpc.port=8548
      - --rpc.enable-admin
      - --max-channel-duration=50
      - --l1-eth-rpc=${L1_RPC_URL}
      - --private-key=${OP_BATCHER_PRIVATE_KEY}
      - --max-blocks-per-span-batch=10
      - --data-availability-type=blobs

  op-proposer:
    networks:
      - op_net
    ports:
      - "8560:8560"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override inter-container URLs for bridge networking
    command:
      - op-proposer
      - --poll-interval=12s
      - --rpc.port=8560
      - --rollup-rpc=http://op-node:${OP_NODE_RPC_PORT}
      - --game-factory-address=${DISPUTE_GAME_FACTORY_ADDRESS}
      - --game-type=${DISPUTE_GAME_TYPE}
      - --private-key=${OP_PROPOSER_PRIVATE_KEY}
      - --l1-eth-rpc=${L1_RPC_URL}
      - --proposal-interval=2s

  based-portal:
    networks:
      - op_net
    ports:
      - "${PORTAL_PORT}:${PORTAL_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override inter-container URLs for bridge networking
    command:
      - --fallback.eth_url=http://op-geth:${OP_GETH_RPC_PORT}
      - --fallback.engine_url=http://op-geth:${OP_GETH_ENGINE_RPC_PORT}
      - --op_node.url=http://op-node:${OP_NODE_RPC_PORT}
      - --registry.url=http://based-registry:${REGISTRY_PORT}
      - --gateway.timeout_ms=200

  based-registry:
    networks:
      - op_net
    ports:
      - "${REGISTRY_PORT}:${REGISTRY_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override inter-container URLs for bridge networking
    command:
      - --registry.path=/config/registry.json
      - --portal.url=http://op-geth:${OP_GETH_RPC_PORT}
      - --portal.timeout_ms=100
      - --port=${REGISTRY_PORT}

  blockscout-postgres:
    networks:
      - op_net
    ports:
      - "5432:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  blockscout:
    networks:
      - op_net
    ports:
      - "${BLOCKSCOUT_PORT}:${BLOCKSCOUT_PORT}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - blockscout-postgres
      - op-geth
    environment:
      DATABASE_URL: "postgresql://blockscout:blockscout@blockscout-postgres:5432/blockscout"
      PORT: "${BLOCKSCOUT_PORT}"
      ETHEREUM_JSONRPC_HTTP_URL: "http://op-geth:${OP_GETH_RPC_PORT}"
      ETHEREUM_JSONRPC_WS_URL: "ws://op-geth:${OP_GETH_WS_PORT}"
      ETHEREUM_JSONRPC_TRACE_URL: "http://op-geth:${OP_GETH_RPC_PORT}"
      ETHEREUM_JSONRPC_VARIANT: "geth"
      SECRET_KEY_BASE: "56NtB48ear7+wMSf0IQuWDAAazhpb31qyc7GiyspBP2vh7t5zlCsF5QDv76chXeN"
      NETWORK: "local"
      API_V2_ENABLED: "true"
      ECTO_USE_SSL: "false"
      SSG_ENABLED: "false"

  restarter:
    extra_hosts:
      - "host.docker.internal:host-gateway"

