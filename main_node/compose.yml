services:
  op-geth:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-geth:v1.101503.4-rc.1
    container_name: op-geth
    network_mode: "host"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 1) if this directory lacks the geth chaindata, initialize it
        if [ ! -d /data/geth/geth/chaindata ]; then
          echo ">>> initializing geth datadir…"
          geth init \
            --state.scheme=hash \
            --datadir=/data/geth \
            /config/genesis.json 
        fi
        # 2) then exec the real geth with all your flags
        exec geth \
          --networkid=$NETWORK_ID \
          --datadir=/data/geth \
          --gcmode=archive \
          --state.scheme=hash \
          --http \
          --http.addr=0.0.0.0 \
          --http.vhosts="*" \
          --http.corsdomain="*" \
          --http.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port=$OP_GETH_WS_PORT \
          --ws.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws.origins="*" \
          --authrpc.port=$OP_GETH_ENGINE_RPC_PORT \
          --authrpc.addr=0.0.0.0 \
          --authrpc.vhosts="*" \
          --authrpc.jwtsecret=/config/jwt \
          --syncmode=full \
          --rpc.allow-unprotected-txs \
          --discovery.port=$OP_GETH_GOSSIP_PORT \
          --port=$OP_GETH_GOSSIP_PORT
    volumes:
      - ./data/geth:/data/geth
      - ./config:/config
    restart: unless-stopped

  op-node:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-node:v1.13.2
    container_name: op-node
    entrypoint:
      - sh
      - -c
      - |
        sleep "${OP_NODE_DELAY:-10}" &&
        exec op-node "$@"
    network_mode: "host"
    # Override inter-container URLs for bridge networking
    command:
      - op-node
      - --l2=http://0.0.0.0:${PORTAL_PORT}
      - --l2.jwt-secret=/config/jwt
      - --verifier.l1-confs=1
      - --rollup.config=/config/rollup.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=${OP_NODE_RPC_PORT}
      - --rpc.enable-admin
      - --l1=${L1_RPC_URL}
      - --l1.rpckind=standard
      - --l1.beacon=${L1_BEACON_RPC_URL}
      - --p2p.advertise.ip=${OP_NODE_GOSSIP_IP}
      - --p2p.advertise.tcp=${OP_NODE_GOSSIP_PORT}
      - --p2p.advertise.udp=${OP_NODE_GOSSIP_PORT}
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=${OP_NODE_GOSSIP_PORT}
      - --p2p.listen.udp=${OP_NODE_GOSSIP_PORT}
      - --p2p.sequencer.key=${OP_NODE_SEQUENCER_KEY}
      - --safedb.path=/data/op-node/op-node-beacon-data
      - --sequencer.enabled

    volumes:
      - ./data/node:/data/op-node
      - ./config:/config
    depends_on:
      - op-geth
      - based-portal
    restart: unless-stopped
    
  op-batcher:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-batcher:v1.13.2
    container_name: op-batcher
    network_mode: "host"

    # Override inter-container URLs for bridge networking
    command:
      - op-batcher
      - --l2-eth-rpc=http://0.0.0.0:${PORTAL_PORT}
      - --rollup-rpc=http://0.0.0.0:${OP_NODE_RPC_PORT}
      - --sub-safety-margin=6
      - --num-confirmations=1
      - --safe-abort-nonce-too-low-count=3
      - --resubmission-timeout=30s
      - --rpc.addr=0.0.0.0
      - --rpc.port=8548
      - --rpc.enable-admin
      - --max-channel-duration=50
      - --l1-eth-rpc=${L1_RPC_URL}
      - --private-key=${OP_BATCHER_PRIVATE_KEY}
      - --max-blocks-per-span-batch=10
      - --data-availability-type=blobs
    depends_on:
      - op-node
    restart: unless-stopped

  op-proposer:
    image: us-docker.pkg.dev/oplabs-tools-artifacts/images/op-proposer:v1.10.0
    container_name: op-proposer
    network_mode: "host"
    command:
      - op-proposer
      - --poll-interval=12s
      - --rpc.port=8560
      - --rollup-rpc=http://0.0.0.0:${OP_NODE_RPC_PORT}
      - --game-factory-address=${DISPUTE_GAME_FACTORY_ADDRESS}
      - --game-type=${DISPUTE_GAME_TYPE}
      - --private-key=${OP_PROPOSER_PRIVATE_KEY}
      - --l1-eth-rpc=${L1_RPC_URL}
      - --proposal-interval=2s

    depends_on:
      - op-node
    restart: unless-stopped

  based-portal:
    image: ghcr.io/gattaca-com/based-op/based-portal:latest 
    pull_policy: always
    container_name: based-portal
    network_mode: "host"
    # Override inter-container URLs for bridge networking
    command:
      - --fallback.eth_url=http://0.0.0.0:${OP_GETH_RPC_PORT}
      - --fallback.engine_url=http://0.0.0.0:${OP_GETH_ENGINE_RPC_PORT}
      - --op_node.url=http://0.0.0.0:${OP_NODE_RPC_PORT}
      - --registry.url=http://0.0.0.0:${REGISTRY_PORT}
      - --gateway.timeout_ms=200
    volumes:
      - ./config:/config
    restart: unless-stopped

  based-registry:
    image: ghcr.io/gattaca-com/based-op/based-registry:latest
    pull_policy: always
    container_name: based-registry
    network_mode: "host"
    # Override inter-container URLs for bridge networking
    command:
      - --registry.path=/config/registry.json
      - --portal.url=http://0.0.0.0:${OP_GETH_RPC_PORT}
      - --portal.timeout_ms=100
      - --port=${REGISTRY_PORT}
    volumes: 
      - ./config:/config
    restart: unless-stopped
    
  restarter:
    image: docker:cli
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    command: ["/bin/sh", "-c", "while true; do sleep 3600; docker restart op-batcher; done"]
    restart: unless-stopped
    network_mode: "host"
################################################################################
# Postgres for Blockscout
################################################################################
  blockscout-postgres:
    image: postgres:14-alpine
    container_name: blockscout-postgres
    restart: unless-stopped
    environment:
      # these credentials will be baked into the Blockscout DATABASE_URL below
      POSTGRES_USER: blockscout
      POSTGRES_PASSWORD: blockscout
      POSTGRES_DB:     blockscout
    volumes:
      - ./data/blockscout-postgres:/var/lib/postgresql/data
    shm_size: '50gb'
    network_mode: "host"

################################################################################
# Blockscout explorer
################################################################################
  blockscout:
    image: blockscout/blockscout:6.8.0
    container_name: blockscout
    command:
      - /bin/sh
      - -c
      - bin/blockscout eval "Elixir.Explorer.ReleaseTasks.create_and_migrate()" && bin/blockscout start
    
    network_mode: "host"
    depends_on:
      - op-node                  # need the L2 node up to serve RPC
      - blockscout-postgres      # need the DB up first
    environment:
      DATABASE_URL: "postgresql://blockscout:blockscout@blockscout-postgres:5432/blockscout"
      # point to your L2 JSON-RPC:
      ETHEREUM_JSONRPC_HTTP_URL: "http://0.0.0.0:${OP_GETH_RPC_PORT}"
      ETHEREUM_JSONRPC_WS_URL: "ws://0.0.0.0:${OP_GETH_WS_PORT}"
      ETHEREUM_JSONRPC_TRACE_URL: "http://0.0.0.0:${OP_GETH_RPC_PORT}"
      ETHEREUM_JSONRPC_VARIANT: "geth"
      SECRET_KEY_BASE: "56NtB48ear7+wMSf0IQuWDAAazhpb31qyc7GiyspBP2vh7t5zlCsF5QDv76chXeN"
      # A “network name” for Blockscout’s UI
      NETWORK:        "local"
      API_V2_ENABLED: "true"
      # disable Subgraph support if you don’t have one
      ECTO_USE_SSL:   "false"
      SSG_ENABLED:    "false"
      PORT: "${BLOCKSCOUT_PORT}"
    # no ports: host-mode means Blockscout binds to 4000 on the host automatically

