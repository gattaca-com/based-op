[package]
name = "chain-replay"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy = { version = "1.0.27", features = ["provider-engine-api"] }
alloy-consensus = { version = "1.0.27" }
alloy-network = { version = "1.0.27" }
alloy-rpc-client = { version = "1.0.27" }
alloy-transport-http = { version = "1.0.27", features = ["jwt-auth"] }
clap = { version = "4.5.46", features = ["derive", "env"] }
dotenvy = "0.15.7"
http-body-util = { version = "0.1.3" }
op-alloy = { version = "0.19.1" }
op-alloy-consensus = { version = "0.19.1" }
op-alloy-network = { version = "0.19.1" }
op-alloy-provider = { version = "0.19.1" }
op-alloy-rpc-types = { version = "0.19.1" }
op-alloy-rpc-types-engine = { version = "0.19.1" }
serde_json = { version = "1.0.143" }
tokio = { version = "1.47.1", features = ["full"] }
tower = { version = "0.5.2" }
url = { version = "2.5.7" }
