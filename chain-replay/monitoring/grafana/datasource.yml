apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    access: proxy
    editable: false

  - name: Loki
    type: loki
    url: http://loki:3100
    isDefault: false
    access: proxy
    editable: false
    jsonData:
      timeout: 60
      maxLines: 1000
