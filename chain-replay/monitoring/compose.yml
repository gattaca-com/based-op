services:
  based-metrics-exporter:
    image: ghcr.io/chainbound/based-op/metrics-exporter:latest-amd64 # arm64 also available. TODO: make cross-platform
    container_name: based-metrics-exporter
    restart: unless-stopped
    environment:
      - RUST_LOG=bop_metrics_exporter=trace,bop_metrics=trace
    volumes:
      - /tmp:/tmp
      - /dev/shm:/dev/shm
    command:
      - "--port=9000"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=based-op
      - GF_SECURITY_ADMIN_PASSWORD=grafana
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/dashboard.json
    networks:
      - monitoring
    depends_on:
      - prometheus

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped
    ports:
      - 9085:9085
    environment:
      - HOSTNAME
    volumes:
      - ./promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /run/user/1000/docker.sock:/var/run/docker.sock
      - /var/log/containers:/var/log/containers:ro
    command:
      - --config.file=/etc/promtail/promtail.yml
    networks:
      - monitoring

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: unless-stopped
    ports:
      - 3100:3100
    volumes:
      - loki-data:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
    command:
      - --config.file=/etc/loki/loki.yml
    networks:
      - monitoring

volumes:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  monitoring:
    driver: bridge
