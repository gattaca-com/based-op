services:
  based-op-geth:
    image: ghcr.io/gattaca-com/based-op-geth/based-op-geth:latest
    pull_policy: always
    container_name: based-op-geth
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 1) initialize datadir if needed
        if [ ! -d /data/geth/geth/chaindata ]; then
          echo ">>> initializing geth datadir…"
          geth init \
            --state.scheme=hash \
            --datadir=/data/geth \
            /config/genesis.json
        fi

        # 2) build argv with conditionals (POSIX sh)
        set -- \
          --datadir=/data/geth \
          --gcmode=archive \
          --state.scheme=hash \
          --syncmode=full \
          --rpc.allow-unprotected-txs \
          --allow-insecure-unlock \
          --http \
          --http.addr=0.0.0.0 \
          --http.port="${OP_GETH_RPC_PORT}" \
          --http.vhosts="*" \
          --http.corsdomain="*" \
          --http.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port="${OP_GETH_WS_PORT}" \
          --ws.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws.origins="*" \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port="${OP_GETH_ENGINE_RPC_PORT}" \
          --authrpc.vhosts="*" \
          --authrpc.jwtsecret=/config/jwt \
          --discovery.port="${OP_GETH_GOSSIP_PORT}" \
          --port="${OP_GETH_GOSSIP_PORT}" \
          --nat="extip:${OP_GETH_EXTIP}"

        # Bootnodes
        if [ -n "${OP_GETH_BOOTNODES:-}" ]; then
          set -- "$@" --bootnodes="${OP_GETH_BOOTNODES}"
        fi

        # OP network (optional)
        if [ -n "${OP_GETH_NETWORK:-}" ]; then
          set -- "$@" --op-network="${OP_GETH_NETWORK}"
        fi

        exec geth "$@"

    volumes:
      - ./data/geth:/data/geth
      - ./config:/config
    restart: unless-stopped
    network_mode: "host"

  based-op-node:
    image: ghcr.io/gattaca-com/based-optimism/based-op-node:latest
    pull_policy: always
    container_name: based-op-node
    network_mode: "host"
    command:
      - op-node
      - --l2=http://0.0.0.0:$OP_GETH_ENGINE_RPC_PORT
      - --l2.jwt-secret=/config/jwt
      - --verifier.l1-confs=1
      - --rollup.config=/config/rollup.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=8547
      - --rpc.enable-admin
      - --l1=$L1_RPC_URL
      - --l1.rpckind=standard
      - --l1.beacon=$L1_BEACON_RPC_URL
      - --p2p.advertise.ip=$OP_NODE_GOSSIP_IP
      - --p2p.advertise.tcp=$OP_NODE_GOSSIP_PORT
      - --p2p.advertise.udp=$OP_NODE_GOSSIP_PORT
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=$OP_NODE_GOSSIP_PORT
      - --p2p.listen.udp=$OP_NODE_GOSSIP_PORT
      - --safedb.path=/data/op-node/op-node-beacon-data
      # - --p2p.static=$MAIN_OP_NODE_GOSSIP_STATIC
      - --p2p.discovery=false
      - --rpc.enable-based
      - --registry=$PORTAL
      - --p2p.bootnodes=$MAIN_OP_NODE_ENR
      - --syncmode=execution-layer
    volumes:
      - ./data/node:/data/op-node
      - ./config:/config
    depends_on:
      - based-op-geth
    restart: unless-stopped

  based-gateway:
    image: ghcr.io/gattaca-com/based-op/based-gateway:latest
    pull_policy: always
    container_name: based-gateway
    command:
      - --rpc.port=$GATEWAY_PORT
      - --rpc.host=0.0.0.0
      - --chain=/config/genesis.json
      - --db.datadir=/data/gateway
      - --eth_client.url=http://0.0.0.0:$OP_GETH_RPC_PORT
      - --rpc.jwt=/config/jwt
      - --gossip.signer_private_key=$GATEWAY_SEQUENCING_KEY
      - --gossip.root_peer_url=http://0.0.0.0:8547
      - --mock=Verification
    volumes:
      - ./config:/config
      - ./data/gateway:/data/gateway
      - /tmp:/tmp
      - /dev/shm:/dev/shm
    network_mode: "host"
    restart: unless-stopped
