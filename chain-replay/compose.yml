      - "${BOP_REPLAY_BASED_OP_GETH_1_GOSSIP_PORT}:${BOP_REPLAY_BASED_OP_GETH_1_GOSSIP_PORT}/tcp"
      - "${BOP_REPLAY_BASED_OP_GETH_1_GOSSIP_PORT}:${BOP_REPLAY_BASED_OP_GETH_1_GOSSIP_PORT}/udp"
      - "${BOP_REPLAY_BASED_OP_GETH_1_METRICS_PORT}:${BOP_REPLAY_BASED_OP_GETH_1_METRICS_PORT}"

  bop-replay-based-registry:
    image: ghcr.io/chainbound/based-op/registry:latest-amd64
    container_name: bop-replay-based-registry
    environment:
      - RUST_LOG=${BOP_REPLAY_RUST_LOG:-}
    command:
      - --registry.path=/config/registry.json
      - --eth_rpc_url=http://bop-replay-based-op-geth-0:${BOP_REPLAY_BASED_OP_GETH_0_RPC_PORT}
      - --port=${BOP_REPLAY_REGISTRY_PORT}
      - --log.dir=/var/log/app
    volumes:
      - ./config:/config
      - /tmp:/tmp
      - /dev/shm:/dev/shm
      - /var/log/containers/based-op/based-registry:/var/log/app
    restart: unless-stopped
    ports:
      - "${BOP_REPLAY_REGISTRY_PORT}:${BOP_REPLAY_REGISTRY_PORT}"

  bop-replay-based-op-node-0:
    image: ghcr.io/chainbound/op-node:1e545641929fb26476e885dd9c70be2d627e4fd4-11-09-2025
    container_name: bop-replay-based-op-node-0
    environment:
      GOLOG_LOG_LEVEL: "debug"
      BOP_REPLAY: "true"
      BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_IP: "${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_IP:-}"
      BOP_REPLAY_BASED_OP_NODE_1_GOSSIP_IP: "${BOP_REPLAY_BASED_OP_NODE_1_GOSSIP_IP:-}"
    command:
      - op-node
      - --l1.beacon=${BOP_REPLAY_L1_BEACON_RPC_URL}
      - --l1.rpckind=standard
      - --l1=${BOP_REPLAY_L1_RPC_URL}
      - --l2.jwt-secret=/config/jwt
      - --l2=http://bop-replay-based-op-geth-0:${BOP_REPLAY_BASED_OP_GETH_0_ENGINE_RPC_PORT}
      - --log.level=debug
      - --p2p.advertise.ip=${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_IP}
      - --p2p.advertise.tcp=${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}
      - --p2p.advertise.udp=${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}
      - --p2p.listen.udp=${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}
      - --p2p.no-discovery=true
      - --p2p.static=/ip4/${BOP_REPLAY_KONA_SEQUENCER_IP}/tcp/${BOP_REPLAY_KONA_SEQUENCER_GOSSIP_PORT}/p2p/16Uiu2HAm3d6XznXaJu4YdfA1Gn8GBabgtj8qydx8jSowMsXjcqnU,/ip4/${BOP_REPLAY_BASED_OP_NODE_1_GOSSIP_IP}/tcp/${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}/p2p/16Uiu2HAkyh1AzdmFQR1RvgpHTtogShdKnhZDPaPLGJM4jHePnuyt
      - --p2p.priv.raw=6ef638ab9a0c56cab2ce058ec2280d2d5f655ec29dafac0cf46b8b66b82051da
      - --p2p.scoring=none
      - --registry=http://bop-replay-based-registry:${BOP_REPLAY_REGISTRY_PORT}
      - --rollup.config=/config/rollup.json
      - --rpc.addr=0.0.0.0
      - --rpc.enable-admin
      - --rpc.enable-based
      - --rpc.port=${BOP_REPLAY_BASED_OP_NODE_0_RPC_PORT}
      - --safedb.path=/data/op-node/op-node-beacon-data
      - --syncmode=execution-layer
      - --l2.skip-sync-start-check=true # As recommended in https://github.com/gattaca-com/based-optimism/blob/8d2ac48c88bf659da9a3dbe4ef04c0fbbfc7b240/op-node/rollup/sync/config.go#L67-L72
      - --verifier.l1-confs=1
      - --metrics.enabled=true
      - --metrics.addr=0.0.0.0
      - --metrics.port=${BOP_REPLAY_BASED_OP_NODE_0_METRICS_PORT}
    labels:
      - logs=enabled
      - service=bop-replay-based-op-node-0
    volumes:
      - ./data_0/node:/data/op-node
      - ./config:/config
    restart: unless-stopped
    ports:
      - "${BOP_REPLAY_BASED_OP_NODE_0_RPC_PORT}:${BOP_REPLAY_BASED_OP_NODE_0_RPC_PORT}"
      - "${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}:${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}/tcp"
      - "${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}:${BOP_REPLAY_BASED_OP_NODE_0_GOSSIP_PORT}/udp"
      - "${BOP_REPLAY_BASED_OP_NODE_0_METRICS_PORT}:${BOP_REPLAY_BASED_OP_NODE_0_METRICS_PORT}"

