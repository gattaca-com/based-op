  bop-replay-based-gateway:
    image: local_based_gateway
    # pull_policy: always
    container_name: bop-replay-based-gateway
    environment:
      - RUST_LOG=${BOP_REPLAY_RUST_LOG:-}
    command:
      - --rpc.port_no_auth=${BOP_REPLAY_GATEWAY_PORT_NO_AUTH}
      - --rpc.port=${BOP_REPLAY_GATEWAY_PORT}
      - --rpc.host=0.0.0.0
      - --chain=/config/genesis.json
      - --db.datadir=/data/gateway
      - --eth_client.url=http://bop-replay-based-op-geth-0:${BOP_REPLAY_BASED_OP_GETH_0_RPC_PORT}
      - --rpc.jwt=/config/jwt
      - --gossip.signer_private_key=${BOP_REPLAY_GATEWAY_SEQUENCING_KEY}
      - --gossip.root_peer_url=http://bop-replay-based-op-node-0:${BOP_REPLAY_BASED_OP_NODE_0_RPC_PORT}
      - --chain-replay.blocks-range=${BOP_REPLAY_BLOCKS_RANGE}
    labels:
      - logs=enabled
      - service=bop-replay-based-gateway
    volumes:
      - ./config:/config
      - ./data/gateway:/data/gateway
      - /tmp:/tmp
      - /dev/shm:/dev/shm
      - /var/log/containers/based-op/based-gateway:/var/log/app
    restart: unless-stopped
    ports:
      - "${BOP_REPLAY_GATEWAY_PORT}:${BOP_REPLAY_GATEWAY_PORT}"
      - "${BOP_REPLAY_GATEWAY_PORT_NO_AUTH}:${BOP_REPLAY_GATEWAY_PORT_NO_AUTH}"
