services:
  bop-replay-based-op-geth:
    image: ghcr.io/gattaca-com/based-op-geth/based-op-geth:latest
    pull_policy: always
    container_name: bop-replay-based-op-geth
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 1) initialize datadir if needed
        if [ ! -d /data/geth/geth/chaindata ]; then
          echo ">>> initializing geth datadir…"
          geth init \
            --state.scheme=hash \
            --datadir=/data/geth \
            /config/genesis.json
        fi

        # 2) build argv with conditionals (POSIX sh)
        set -- \
          --datadir=/data/geth \
          --gcmode=archive \
          --state.scheme=hash \
          --syncmode=full \
          --rpc.allow-unprotected-txs \
          --allow-insecure-unlock \
          --http \
          --http.addr=0.0.0.0 \
          --http.port="${BOP_REPLAY_BASED_OP_GETH_RPC_PORT}" \
          --http.vhosts="*" \
          --http.corsdomain="*" \
          --http.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port="${BOP_REPLAY_BASED_OP_GETH_WS_PORT}" \
          --ws.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws.origins="*" \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port="${BOP_REPLAY_BASED_OP_GETH_ENGINE_RPC_PORT}" \
          --authrpc.vhosts="*" \
          --authrpc.jwtsecret=/config/jwt \
          --discovery.port="${BOP_REPLAY_BASED_OP_GETH_GOSSIP_PORT}" \
          --port="${BOP_REPLAY_BASED_OP_GETH_GOSSIP_PORT}" \
          --nat="extip:${BOP_REPLAY_BASED_OP_GETH_EXTIP}" \

        if [ -n "${BOP_REPLAY_BASED_OP_GETH_BOOTNODES:-}" ]; then
          set -- "$@" --bootnodes="${BOP_REPLAY_BASED_OP_GETH_BOOTNODES}"
        fi

        if [ -n "${BOP_REPLAY_BASED_OP_GETH_NETWORK:-}" ]; then
          set -- "$@" --op-network="${BOP_REPLAY_BASED_OP_GETH_NETWORK}"
        fi

        exec geth "$@"

    volumes:
      - ./data/geth:/data/geth
      - ./config:/config
    restart: unless-stopped
    network_mode: "host"

  bop-replay-based-registry:
    image: local_based_registry
    container_name: bop-replay-based-registry
    network_mode: "host"
    command:
      - --registry.path=/config/registry.json
      - --eth_rpc_url=http://0.0.0.0:${BOP_REPLAY_BASED_OP_GETH_RPC_PORT}
      - --port=${BOP_REPLAY_REGISTRY_PORT}
    volumes:
      - ./config:/config
    restart: unless-stopped

  bop-replay-based-op-node:
    image: ghcr.io/chainbound/op-node:586ab88da3cc0b0123e987c58bf5ed92a946b029
    container_name: bop-replay-based-op-node
    network_mode: "host"
    environment:
      GOLOG_LOG_LEVEL: "debug"
    command:
      - op-node
      - --l2=http://0.0.0.0:${BOP_REPLAY_BASED_OP_GETH_ENGINE_RPC_PORT}
      - --l2.jwt-secret=/config/jwt
      - --verifier.l1-confs=1
      - --rollup.config=/config/rollup.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=${BOP_REPLAY_BASED_OP_NODE_RPC_PORT}
      - --rpc.enable-admin
      - --l1=${BOP_REPLAY_L1_RPC_URL}
      - --l1.rpckind=standard
      - --l1.beacon=${BOP_REPLAY_L1_BEACON_RPC_URL}
      - --p2p.advertise.ip=${BOP_REPLAY_BASED_OP_NODE_GOSSIP_IP}
      - --p2p.advertise.tcp=${BOP_REPLAY_BASED_OP_NODE_GOSSIP_PORT}
      - --p2p.advertise.udp=${BOP_REPLAY_BASED_OP_NODE_GOSSIP_PORT}
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=${BOP_REPLAY_BASED_OP_NODE_GOSSIP_PORT}
      - --p2p.listen.udp=${BOP_REPLAY_BASED_OP_NODE_GOSSIP_PORT}
      - --safedb.path=/data/op-node/op-node-beacon-data
      - --p2p.static=/ip4/127.0.0.1/tcp/32303/p2p/16Uiu2HAm3d6XznXaJu4YdfA1Gn8GBabgtj8qydx8jSowMsXjcqnU
      - --p2p.no-discovery=true
      - --rpc.enable-based
      - --registry=http://0.0.0.0:${BOP_REPLAY_REGISTRY_PORT}
      - --syncmode=execution-layer
      - --log.level=debug
      - --unsafe-allow-old-payloads=true
    volumes:
      - ./data/node:/data/op-node
      - ./config:/config
    restart: unless-stopped

  bop-replay-based-gateway:
    image: local_based_gateway:rollback
    # pull_policy: always
    container_name: bop-replay-based-gateway
    environment:
      - RUST_LOG=${BOP_RELAY_RUST_LOG_GATEWAY:-}
    command:
      - --rpc.port_no_auth=${BOP_REPLAY_GATEWAY_PORT_NO_AUTH}
      - --rpc.port=${BOP_REPLAY_GATEWAY_PORT}
      - --rpc.host=0.0.0.0
      - --chain=/config/genesis.json
      - --db.datadir=/data/gateway
      - --eth_client.url=http://0.0.0.0:${BOP_REPLAY_BASED_OP_GETH_RPC_PORT}
      - --rpc.jwt=/config/jwt
      - --gossip.signer_private_key=${BOP_REPLAY_GATEWAY_SEQUENCING_KEY}
      - --gossip.root_peer_url=http://0.0.0.0:${BOP_REPLAY_BASED_OP_NODE_RPC_PORT}
      - --chain-replay.blocks-range=${BOP_REPLAY_BLOCKS_RANGE}
      - --chain-replay.l2-el-verifier-url=${BOP_REPLAY_L2_EL_VERIFIER_URL}

    volumes:
      - ./config:/config
      - ./data/gateway:/data/gateway
      - /tmp:/tmp
      - /dev/shm:/dev/shm
    network_mode: "host"
    restart: unless-stopped
