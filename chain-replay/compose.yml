services:
  bop-replay-based-op-geth-0:
    image: ghcr.io/gattaca-com/based-op-geth/based-op-geth:latest
    pull_policy: always
    container_name: bop-replay-based-op-geth-0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 1) initialize datadir if needed
        if [ ! -d /data/geth/geth/chaindata ]; then
          echo ">>> initializing geth datadir…"
          geth init \
            --state.scheme=hash \
            --datadir=/data/geth \
            /config/genesis.json
        fi

        # 2) build argv with conditionals (POSIX sh)
        set -- \
          --datadir=/data/geth \
          --gcmode=archive \
          --state.scheme=hash \
          --syncmode=full \
          --rpc.allow-unprotected-txs \
          --allow-insecure-unlock \
          --http \
          --http.addr=0.0.0.0 \
          --http.port="${BOP_REPLAY_BASED_OP_GETH_0_RPC_PORT}" \
          --http.vhosts="*" \
          --http.corsdomain="*" \
          --http.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port="${BOP_REPLAY_BASED_OP_GETH_0_WS_PORT}" \
          --ws.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws.origins="*" \
          --authrpc.addr=0.0.0.0 \
          --authrpc.port="${BOP_REPLAY_BASED_OP_GETH_0_ENGINE_RPC_PORT}" \
          --authrpc.vhosts="*" \
          --authrpc.jwtsecret=/config/jwt \
          --discovery.port="${BOP_REPLAY_BASED_OP_GETH_0_GOSSIP_PORT}" \
          --port="${BOP_REPLAY_BASED_OP_GETH_0_GOSSIP_PORT}" \
          --nat="extip:${BOP_REPLAY_BASED_OP_GETH_0_EXTIP}" \
          --metrics=true \
          --metrics.addr=0.0.0.0 \
          --metrics.port=${BOP_REPLAY_BASED_OP_GETH_0_METRICS_PORT}

        if [ -n "${BOP_REPLAY_BASED_OP_GETH_0_BOOTNODES:-}" ]; then
          set -- "$@" --bootnodes="${BOP_REPLAY_BASED_OP_GETH_0_BOOTNODES}"
        fi

        if [ -n "${BOP_REPLAY_BASED_OP_GETH_0_NETWORK:-}" ]; then
          set -- "$@" --op-network="${BOP_REPLAY_BASED_OP_GETH_0_NETWORK}"
        fi

        exec geth "$@"

    labels:
      - logs=enabled
      - service=bop-replay-based-op-geth-0
    volumes:
      - ./data_0/geth:/data/geth
      - ./config:/config
    restart: unless-stopped
    ports:
      - "${BOP_REPLAY_BASED_OP_GETH_0_RPC_PORT}:${BOP_REPLAY_BASED_OP_GETH_0_RPC_PORT}"
      - "${BOP_REPLAY_BASED_OP_GETH_0_WS_PORT}:${BOP_REPLAY_BASED_OP_GETH_0_WS_PORT}"
      - "${BOP_REPLAY_BASED_OP_GETH_0_ENGINE_RPC_PORT}:${BOP_REPLAY_BASED_OP_GETH_0_ENGINE_RPC_PORT}"
      - "${BOP_REPLAY_BASED_OP_GETH_0_GOSSIP_PORT}:${BOP_REPLAY_BASED_OP_GETH_0_GOSSIP_PORT}/tcp"
      - "${BOP_REPLAY_BASED_OP_GETH_0_GOSSIP_PORT}:${BOP_REPLAY_BASED_OP_GETH_0_GOSSIP_PORT}/udp"
      - "${BOP_REPLAY_BASED_OP_GETH_0_METRICS_PORT}:${BOP_REPLAY_BASED_OP_GETH_0_METRICS_PORT}"

