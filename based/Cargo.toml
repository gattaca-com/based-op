[workspace]
members = ["bin/*", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
repository = "https://github.com/gattaca-com/based-op"
rust-version = "1.85.0"
version = "0.1.0"

[workspace.dependencies]
alloy-consensus = "1.0.41"
alloy-eips = "1.0.41"
alloy-network = "1.0.41"
alloy-primitives = { version = "1.0.41", default-features = false, features = [
  "getrandom",
] }
alloy-provider = "1.0.41"
alloy-rlp = "0.3.12"
alloy-rpc-types = { version = "1.0.41", features = ["engine"] }
alloy-signer = "1.0.41"
alloy-signer-local = "1.0.41"
alloy-transport = "1.0.41"
alloy-transport-http = "1.0.41"
auto_impl = "1.3.0"
axum = { version = "0.8.1", features = ["macros", "ws"] }

backtrace = "0.3.73"
bitflags = "2.6.0"
bop-common = { path = "crates/common" }
bop-db = { path = "crates/db" }
bop-metrics = { path = "crates/metrics" }
bop-pool = { path = "crates/pool" }
bop-rpc = { path = "crates/rpc" }
bop-sequencer = { path = "crates/sequencer" }
chrono = "0.4.23"
clap = { version = "4.5.27", features = ["derive", "env"] }
crossbeam-channel = "0.5.14"
directories = "5.0.1"
either = "1.15.0"
ethereum_ssz = "0.9.0"
eyre = "0.6.12"
futures = "0.3.31"
hickory-resolver = "=0.25.0-alpha.5" # Use the exact version reth expects
http = "1.3.1"
hyper = "1.5.2"
jsonrpsee = { version = "0.26", features = ["http-client", "macros", "server", "jsonrpsee-client-transport"] }
kona-interop = { git = "https://github.com/op-rs/kona", rev = "aa7e89596afa96f08eb1b2e14db269fabeb673ea" }
kona-rpc = { git = "https://github.com/op-rs/kona", rev = "aa7e89596afa96f08eb1b2e14db269fabeb673ea", features = [
  "client",
] }
metrics = "0.24.1"
metrics-exporter-prometheus = "0.16.2"
mio = { features = ["net", "os-poll"], version = "1.0.4" }
mio_httpc = { features = ["native"], version = "0.10.6" }
moka = "0.12.10"
op-alloy-consensus = { version = "0.20.0", default-features = false, features = [
  "k256",
] }
op-alloy-flz = { version = "0.13.1", default-features = false }
op-alloy-network = "0.20.0"
op-alloy-rpc-types = "0.20.0"
op-alloy-rpc-types-engine = { version = "0.20.0", default-features = false, features = [
  "serde",
] }
op-revm = "10.1.0"
parking_lot = "0.12.3"
paste = "0.1.18"
quanta = "0.12.3"
rand = "0.9.0"
reqwest = { version = "0.12.12", features = ["blocking", "json"] }
