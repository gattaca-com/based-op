reth-chain-state = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-chain-state" }
reth-chainspec = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-chainspec" }
reth-cli = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-cli" }
reth-consensus = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-consensus" }
reth-db = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-db" }
reth-db-api = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-db-api" }
reth-db-common = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-db-common" }
reth-evm = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-evm" }
reth-execution-errors = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-execution-errors" }
reth-node-ethereum = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-node-ethereum", features = ["test-utils"] }
reth-node-types = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-node-types" }
reth-optimism-chainspec = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-chainspec" }
reth-optimism-cli = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-cli" }
reth-optimism-consensus = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-consensus" }
reth-optimism-evm = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-evm" }
reth-optimism-forks = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-forks" }
reth-optimism-node = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-node" }
reth-optimism-payload-builder = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-payload-builder" }
reth-optimism-txpool = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-txpool" }
reth-optimism-primitives = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-optimism-primitives" }
reth-primitives = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-primitives" }
reth-primitives-traits = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-primitives-traits" }
reth-provider = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-provider", features = ["test-utils"] }
reth-revm = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-revm" }
reth-rpc-builder = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-rpc-builder" }
reth-rpc-layer = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-rpc-layer" }
reth-stages-types = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-stages-types" }
reth-storage-api = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-storage-api" }
reth-storage-errors = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-storage-errors" }
reth-trie = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-trie" }
reth-trie-common = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-trie-common", features = ["test-utils"] }
reth-trie-db = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-trie-db" }
reth-trie-parallel = { git = "https://github.com/gattaca-com/based-op-reth", rev = "89f90f4a50345dd20bb78051b3aef9bf86903211", package = "reth-trie-parallel" }

revm = { version = "29.0.1", features = [
  "optional_balance_check",
  "secp256k1",
  "std",
], default-features = false }
revm-handler = "12.0.0"
revm-inspector = "10.0.1"
revm-interpreter = "25.0.3"
revm-primitives = { version = "20.2.1", features = [
  "std",
], default-features = false }

rustc-hash = "2.0.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.137"
shared_memory = "^0.12"
signal-hook = "0.3.17"
ssz_types = "0.11.0"
strum = "0.24"
strum_macros = "0.24"
tabwriter = "1.4.1"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["full"] }
toml = "0.8.19"
tower = { version = "0.5", features = ["timeout"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1.41"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "time"] }
tree_hash = "0.10"
tree_hash_derive = "0.10"
uuid = { version = "1.12.1", features = ["serde", "v4"] }

[profile.release-prod]
codegen-units = 1
debug = false
inherits = "release"
lto = true
opt-level = 3
split-debuginfo = "off"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[profile.release-with-debug]
inherits = "dev"
opt-level = 3
