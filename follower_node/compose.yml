networks:
  based_op_net:
    external: true

services:
  based-op-geth:
    image: ghcr.io/gattaca-com/based-op-geth/based-op-geth:latest
    pull_policy: always
    container_name: based-op-geth
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # 1) if this directory lacks the geth chaindata, initialize it
        if [ ! -d /data/geth/geth/chaindata ]; then
          echo ">>> initializing geth datadir…"
          geth init \
            --state.scheme=hash \
            --datadir=/data/geth \
            /config/genesis.json 
        fi
        # 2) then exec the real geth with all your flags
        exec geth \
          --networkid=$NETWORK_ID \
          --datadir=/data/geth \
          --gcmode=archive \
          --state.scheme=hash \
          --http \
          --http.addr=0.0.0.0 \
          --http.port=$OP_GETH_RPC_PORT \
          --http.vhosts="*" \
          --http.corsdomain="*" \
          --http.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws \
          --ws.addr=0.0.0.0 \
          --ws.port=$OP_GETH_WS_PORT \
          --ws.api="admin,engine,net,eth,web3,debug,miner,txpool" \
          --ws.origins="*" \
          --authrpc.port=$OP_GETH_ENGINE_RPC_PORT \
          --authrpc.addr=0.0.0.0 \
          --authrpc.vhosts="*" \
          --authrpc.jwtsecret=/config/jwt \
          --syncmode=full \
          --rpc.allow-unprotected-txs \
          --allow-insecure-unlock \
          --discovery.port=$OP_GETH_GOSSIP_PORT \
          --port=$OP_GETH_GOSSIP_PORT \
          --bootnodes=$MAIN_OP_GETH_ENODE,enode://3ce86ecae36ae4bc4197e555b0c518c642602596e66f851090fc7a2686d29924b7baa6c4fcc8ca886f00f51f6951c4b4251d1cb67f61dc491a70cec212fd0498@18.185.199.51:31303 \
          --rollup.sequencerhttp=$PORTAL

    ports:
      - "${OP_GETH_RPC_PORT:-8645}:${OP_GETH_RPC_PORT:-8645}"
      - "${OP_GETH_WS_PORT:-8646}:${OP_GETH_WS_PORT:-8646}"
      - "${OP_GETH_ENGINE_RPC_PORT:-8651}:${OP_GETH_ENGINE_RPC_PORT:-8651}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/geth:/data/geth
      - ./config:/config
    restart: unless-stopped
    networks:
      - based_op_net

  based-op-node:
    image: ghcr.io/gattaca-com/based-optimism/based-op-node:latest
    pull_policy: always
    container_name: based-op-node
    ports:
      # RPC API
      - "8547:8547"
      # libp2p gossip port (TCP + UDP)
      - "${OP_NODE_GOSSIP_PORT:-9103}:${OP_NODE_GOSSIP_PORT:-9103}/tcp"
      - "${OP_NODE_GOSSIP_PORT:-9103}:${OP_NODE_GOSSIP_PORT:-9103}/udp"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - based_op_net
    command:
      - op-node
      - --l2=http://based-op-geth:$OP_GETH_ENGINE_RPC_PORT
      - --l2.jwt-secret=/config/jwt
      - --verifier.l1-confs=1
      - --rollup.config=/config/rollup.json
      - --rpc.addr=0.0.0.0
      - --rpc.port=8547
      - --rpc.enable-admin
      - --l1=$L1_RPC_URL
      - --l1.rpckind=standard
      - --l1.beacon=$L1_BEACON_RPC_URL
      - --p2p.advertise.ip=$OP_NODE_GOSSIP_IP
      - --p2p.advertise.tcp=$OP_NODE_GOSSIP_PORT
      - --p2p.advertise.udp=$OP_NODE_GOSSIP_PORT
      - --p2p.listen.ip=0.0.0.0
      - --p2p.listen.tcp=$OP_NODE_GOSSIP_PORT
      - --p2p.listen.udp=$OP_NODE_GOSSIP_PORT
      - --safedb.path=/data/op-node/op-node-beacon-data
      - --p2p.static=$MAIN_OP_NODE_GOSSIP_STATIC,/ip4/18.185.199.51/tcp/9103/p2p/16Uiu2HAmGJRM532zEVnLKEddAHdxDZaAqMQsrrcrW2bVCZ7cB2F7
      - --rpc.enable-based 
      - --registry=$PORTAL
      - --p2p.bootnodes=$MAIN_OP_NODE_ENR,enr:-J64QCaqwDg2mvnfNxIeORF1-e8T48KDnz2e7UQiDd9HN2oXUt4VivwSnriwBbN8LH9b2c8PeoVZjOHh0i8thUIwuLaGAZbzHuCdgmlkgnY0gmlwhBK5xzOHb3BzdGFja4Sq6QEAiXNlY3AyNTZrMaEDNinQZAKKWD_KHcpzgJNtqverEw3NmzKr_g7FwiCViFaDdGNwgiOPg3VkcIIjjw
      - --syncmode=execution-layer
    volumes:
      - ./data/node:/data/op-node
      - ./config:/config
    depends_on:
      - based-op-geth
    restart: unless-stopped

  gateway:
    image: ghcr.io/gattaca-com/based-op/based-gateway:latest
    pull_policy: always
    container_name: based-op-gateway
    command:
      - --rpc.port=$GATEWAY_PORT
      - --rpc.host=0.0.0.0
      - --chain=/config/genesis.json
      - --db.datadir=/data/gateway
      - --eth_client.url=$PORTAL
      - --rpc.jwt=/config/jwt
      - --gossip.signer_private_key=$GATEWAY_SEQUENCING_KEY
      - --gossip.root_peer_url=http://based-op-node:8547
    volumes: 
      - ./config:/config
      - ./data/gateway:/data/gateway
      - /tmp:/tmp
      - /dev/shm:/dev/shm
    restart: unless-stopped
    networks:
      - based_op_net
